services:
  postgres:
    image: postgres:17-alpine
    container_name: seatmap-postgres
    environment:
      POSTGRES_USER: seatmap
      POSTGRES_PASSWORD: seatmap
      POSTGRES_DB: seatmap
    ports:
      - "5432:5432"
    volumes:
      - seatmap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatmap -d seatmap"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  seatmap-pgdata:
